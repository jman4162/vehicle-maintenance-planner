[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vehicle-maintenance-planner"
version = "0.1.0.dev0"
description = "Local-first maintenance planning, quote comparison, and authorization support"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Vehicle Maintenance Planner contributors" }]
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=43,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.10,<2",
  "pillow>=10,<13",
  "platformdirs>=4.2,<5",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
apple-ocr = ["pyobjc-framework-Vision>=10.3,<13", "pyobjc-framework-Quartz>=10.3,<13"]
dev = [
  "build>=1.2,<2",
  "cyclonedx-bom>=5,<8",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "slopscore-lint==0.14.2",
]

[project.scripts]
vehicle-maint = "vehicle_maintenance.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_maintenance"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "vehicle_maintenance/alembic"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "alembic",
  "alembic.ini",
  "tests",
  "pwa",
  "prompts",
  "scripts",
  ".codex/config.toml",
  ".github",
  ".mcp.json",
  "AGENTS.md",
  "CLAUDE.md",
  "README.md",
  "LICENSE",
  "DISCLAIMER.md",
  "PRIVACY.md",
  "SECURITY.md",
  "CONTRIBUTING.md",
  "CHANGELOG.md",
  "RELEASE.md",
  "uv.lock",
]
exclude = [
  "maintenance-records",
  "owners-manuals",
  "background_information.local.md",
  "**/.DS_Store",
  "**/__pycache__",
  ".coverage",
  ".pytest_cache",
  ".ruff_cache",
  "pwa/coverage",
  "pwa/dev-dist",
  "pwa/dist",
  "pwa/node_modules",
  "pwa/public/ocr",
]

[tool.pytest.ini_options]
addopts = "--cov=vehicle_maintenance --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
omit = ["src/vehicle_maintenance/cli.py", "src/vehicle_maintenance/api.py", "src/vehicle_maintenance/mcp_server.py", "src/vehicle_maintenance/ocr.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.slopscore]
profile = "technical"
strictness = "conservative"
